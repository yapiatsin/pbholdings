{% load static %}

<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <link href="{% static 'icn.png' %}" rel="icon">
    <title>{% block title %}OPT{% endblock title %} </title>
    <!-- Tell the browser to be responsive to screen width -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- SweetAlert2 -->
    <link rel="stylesheet" href="{% static 'pb/plugins/sweetalert2-theme-bootstrap-4/bootstrap-4.min.css' %}">
    <!-- Toastr -->
    <link rel="stylesheet" href="{% static 'pb/plugins/toastr/toastr.min.css' %}">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="{% static 'pb/plugins/fontawesome-free/css/all.min.css' %}">

    <!-- Ionicons -->
    <link rel="stylesheet" href="https://code.ionicframework.com/ionicons/2.0.1/css/ionicons.min.css">
    <!-- icheck bootstrap -->
    <link rel="stylesheet" href="{% static 'pb/plugins/icheck-bootstrap/icheck-bootstrap.min.css' %}">

    <link rel="stylesheet" href="{% static 'pb/dists/css/adminlte.min.css' %}">
    <!-- Google Font: Source Sans Pro -->
    <link href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700" rel="stylesheet">
    <style>
        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
        }
        
        .login-box {
            position: relative;
            z-index: 2;
        }
        
        body {
            overflow: hidden;
        }
        
        .btn {
            font-size: 16px;
            font-weight: 60;
            color: #1403009d;
            cursor: pointer;
            height: 40px;
            text-align: center;
            border: none;
            background-size: 300% 100%;
            letter-spacing: 2px;
            font-weight: 700;
            -moz-transition: all .4s ease-in-out;
            -o-transition: all .4s ease-in-out;
            -webkit-transition: all .4s ease-in-out;
            transition: all .4s ease-in-out;
        }
        
        .btn:hover {
            background-position: 100% 0;
            -moz-transition: all .4s ease-in-out;
            -o-transition: all .4s ease-in-out;
            -webkit-transition: all .4s ease-in-out;
            transition: all .4s ease-in-out;
        }
    </style>
</head>

<body class="hold-transition login-page">
    <video class="video-background" playsinline autoplay muted loop>
        <source src="{% static 'ass/img/sld.mp4' %}" type="video/mp4">
    </video>
    <div class="login-box">

        <div class="login-logo">
            <script src="https://cdn.lordicon.com/lordicon.js"></script>
            <lord-icon src="https://cdn.lordicon.com/mnxemonz.json" trigger="hover" colors="primary:#e4e4e4" style="width:110px;height:110px">
            </lord-icon>
        </div>
        <div class="card" style="border-radius: 10px; background: rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);">
            <div class="card-body login-card-body" style="border-radius: 10px; background: rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);">
                <p class="login-box-msg text-secondary text-light" style="font-size:22px; font-weight:700">ENTREZ LA CLE</p>
                <form method='post' name="login-form" id="otp-form">
                    {% csrf_token %}
                    <div class="">
                        <div class="row">
                            <div class="otp-container col-lg-12 text-center w-100">
                                <input class="col-lg-3 p-2 mr-2 text-center otp-input text-2xl font-extrabold text-slate-400 bg-slate-100 border border-danger hover:border-slate-100 appearance-none rounded p-3 outline-none focus:bg-white focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100"
                                    type="text" id="otp1" maxlength="1" style="width:50px;border-radius:50px" required />
                                <input class="col-lg-3 p-2 mr-2 text-center otp-input text-2xl font-extrabold text-slate-400 bg-slate-100 border border-danger hover:border-slate-100 appearance-none rounded p-3 outline-none focus:bg-white focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100"
                                    type="text" id="otp2" maxlength="1" style="width:50px;border-radius:50px" required />
                                <input class="col-lg-3 p-2 mr-2 text-center otp-input text-2xl font-extrabold text-slate-400 bg-slate-100 border border-danger hover:border-slate-100 appearance-none rounded p-3 outline-none focus:bg-white focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100"
                                    type="text" id="otp3" maxlength="1" style="width:50px;border-radius:50px" required />
                                <input class="col-lg-3 p-2 mr-2 text-center otp-input text-2xl font-extrabold text-slate-400 bg-slate-100 border border-danger hover:border-slate-100 appearance-none rounded p-3 outline-none focus:bg-white focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100"
                                    type="text" id="otp4" maxlength="1" style="width:50px;border-radius:50px" required />
                            </div>
                        </div>
                        <input type="hidden" id="otp" name="otp">
                    </div>
                    <div class="input-group mb-3 ">

                    </div>

                    <div class="mb-3 text-center">
                        <button type="submit " class="btn btn-default text-center " style="border-radius: 50px;
                            background: rgba(255, 255, 255, 0.2);
                            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.397); color: #1403009d;
                            backdrop-filter: blur(5px); -webkit-backdrop-filter:
                            blur(5px); border: 1px solid rgba(255, 255, 255, 0.3); ">
                        CONNEXION
                        </button>
                    </div>

                    {% if messages %} {% for msg in messages %} {% if msg.tags == 'error' %}
                    <div class="alert alert-danger alert-dismissible fade show" role="alert">
                        {{msg}}
                        <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                                      <span aria-hidden="true">&times;</span>
                                    </button>
                    </div>
                    {% else %}
                    <div class="alert alert-success alert-dismissible fade show" role="alert">
                        <strong>Holy guacamole!</strong> You should check in on some of those fields below.
                        <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                                      <span aria-hidden="true">&times;</span>
                                    </button>
                    </div>
                    {% endif %} {% endfor %} {% endif %}
                </form>

                <p class="mt-3 mb-1 text-center">
                    <a class="mt-3 mb-1 text-center text-light" href="{% url 'login' %}">Login</a>
                </p>

            </div>
            <!-- /.login-card-body -->
        </div>
    </div>
    <!-- /.login-box -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            var myModal = new bootstrap.Modal(document.getElementById('modal-default'));
            myModal.show();

            setTimeout(function() {
                myModal.hide();
            }, 4000);
        });
    </script>
    <!-- jQuery -->
    <script src="{% static 'pb/plugins/jquery/jquery.min.js' %} "></script>
    <!-- Bootstrap 4 -->
    <script src="{% static 'pb/plugins/bootstrap/js/bootstrap.bundle.min.js' %} "></script>
    <!-- AdminLTE App -->
    <script src="{% static 'pb/dists/js/adminlte.min.js' %} "></script>
    <!-- SweetAlert2 -->
    <script src="{% static 'plugins/sweetalert2/sweetalert2.min.js' %}"></script>
    <!-- Toastr -->
    <script src="{% static 'plugins/toastr/toastr.min.js' %}"></script>



    <script>
        document.querySelectorAll('.otp-input').forEach((input, index, inputs) => {
            input.addEventListener('input', () => {
                if (input.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && index > 0 && input.value === '') {
                    inputs[index - 1].focus();
                }
            });
        });
        document.getElementById('otp-form').addEventListener('submit', (e) => {
            let otpValue = '';
            let allFilled = true;
            // Combine the OTP values
            document.querySelectorAll('.otp-input').forEach(input => {
                if (!input.value) {
                    allFilled = false; // If any input is empty, mark allFilled as false
                }
                otpValue += input.value;
            });
            if (!allFilled) {
                alert('Please fill in all OTP fields.'); // Show an error if any field is empty
                e.preventDefault(); // Prevent the form submission if not all fields are filled
            } else {
                // Update the hidden input field with the concatenated OTP value
                document.getElementById('otp').value = otpValue;
            }
        });
        setTimeout(function() {
            const message = document.getElementById('message');
            if (message) {
                message.style.display = 'none';
            }
        }, 3000);
    </script>

</body>

</html>
