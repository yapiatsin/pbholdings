{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">

  <title>pbholding.ci-signup</title>
  <meta content="" name="description">
  <meta content="" name="keywords">
  <!-- Favicons -->
  <link href="{% static 'ass/img/icon.png' %}" rel="icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,600;1,700&family=Roboto:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&family=Work+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
  
  <script src="{% static 'as/js/script.js' %}" type="text/javascript"></script>
  <script src="{% static 'as/js/jquery-2.0.0.min.js' %}" type="text/javascript"></script>
  <script src="{% static 'as/js/jquery-3.3.1.min.js' %}"type="text/javascript"></script>
  <!-- Vendor CSS Files -->
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.5.0/css/all.min.css" integrity="sha512-QfDd74mlg8afgSqm3Vq2Q65e9b3xMhJB4GZ9OcHDVy1hZ6pqBJPWWnMsKDXM7NINoKqJANNGBuVRIpIJ5dogfA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link href="{% static 'ass/vendor/bootstrap/css/bootstrap.min.css' %}" rel="stylesheet">
  <link href="{% static 'ass/vendor/bootstrap-icons/bootstrap-icons.css' %}" rel="stylesheet">
  <link href="{% static 'ass/vendor/fontawesome-free/css/all.min.css' %}" rel="stylesheet">
  <link href="{% static 'ass/vendor/aos/aos.css' %} " rel="stylesheet">
  <link href="{% static 'ass/vendor/glightbox/css/glightbox.min.css' %}" rel="stylesheet">
  <link href="{% static 'ass/vendor/swiper/swiper-bundle.min.css' %}" rel="stylesheet">
  <!-- Template Main CSS File -->
  <link href="{% static 'ass/css/auths.css' %}" rel="stylesheet">
</head>

<body>
  <main id="main">
    <section id="hero" class="hero">
      <div id="hero-carousel" class="carousel slide" data-bs-ride="carousel" data-bs-interval="5000">
        <div class="carousel-item active" >
          <div class="info d-flex align-items-center">
            <div class="container">
              <div class="wrapper-sigup" style="background-image: url('{% static 'ass/img/alto-grey.jpg' %}');">
                <span class="icon-close">
                  <a href="{% url 'home' %}" title="www.pbholding.ci"><i class="fa fa-globe fa-spin"></i></a>
                </span> 
                <div class="form-box login">
                  {% if form.errors %}
                      <div id="message" class="alert alert-success alert-dismissible fade show" role="alert">
                        <p class="text-center small">{{form.errors}}</p>
                      </div>
                    {% endif %}
                  <h3>Créer un compte</h3> 
                  <form method="POST">
                    {% csrf_token %}
                    <div class="input-box">
                        <span class="icon" ><i name="mail" class="fa fa-user"></i></span>
                        {{form.username}}
                        <label for="">Username</label>
                    </div>
                    <div class="input-box">
                        <span class="icon" ><i name="mail" class="fa fa-at"></i></span>
                        {{form.email}}
                        <label for="">Email</label>
                    </div>
                    <div class="input-box">
                        <span class="icon" ><i name="mail" class="fas fa-genderless"></i></span>
                        {{form.gender}}
                    </div>
                    <div class="input-box">
                        <span class="icon"><i class="fa fa-lock"></i></span>
                        {{form.password1}}
                        <label for="">Password</label>
                    </div>
                    <div class="input-box">
                        <span class="icon"><i class="fa fa-key"></i></span>
                        {{form.password2}}
                        <label for="">Confirme mot de passe</label>
                    </div>
                    <!--<div class="remember-forgot">
                        <label> <input type="checkbox">I agree to the terms & conditions</label>
                    </div>-->
                    <button type="submit" class="btn">Enregistrer</button>
                    <div class="login-register">
                      <!--<p>Déjà un compte?<a href="{url 'login' %}" class="login-link"> Connexion</a></p>-->
                      <p><a href="{% url 'dash' %}" class="login-link"> Retour</a></p>
                    </div>
                </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
</main>

<!-- ======= Footer ======= -->
<a href="#" class="scroll-top d-flex align-items-center justify-content-center"><i class="bi bi-arrow-up-short"></i></a>
<div id="preloader"></div>

<!-- Vendor JS Files -->
<script src="{% static 'ass/vendor/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
<script src="{% static 'ass/vendor/aos/aos.js' %}"></script>
<script src="{% static 'ass/vendor/glightbox/js/glightbox.min.js' %}"></script>
<script src="{% static 'ass/vendor/isotope-layout/isotope.pkgd.min.js' %}"></script>
<script src="{% static 'ass/vendor/swiper/swiper-bundle.min.js' %} "></script>
<script src="{% static 'ass/vendor/purecounter/purecounter_vanilla.js' %}"></script>
<script src="{% static 'ass/vendor/php-email-form/validate.js' %}"></script>

<script src="{% static 'as/jscript/js/jquery-3.3.1.min.js' %}"></script>
<script src="{% static 'as/jscript/popper.js' %}"></script>
<script src="{% static 'as/jscript/main.js' %}"></script>
<!-- The javascript plugin to display page loading on top-->
<script src="{% static 'as/jscript/plugins/pace.min.js'%}"></script>
<script src="{% static 'as/jscript/bootstrap.min.js' %}"></script>

<!-- Template Main JS File -->
<script src="{% static 'ass/js/main.js' %}"></script>

</body>
</html>
