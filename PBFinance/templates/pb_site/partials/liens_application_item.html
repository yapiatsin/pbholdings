{% load pb_links %}
{% if lien.lien_store %}
<a href="{{ lien.lien_store }}" target="_blank" rel="noopener noreferrer" title="{{ lien.titre|escape }}"{% if link_class %} class="{{ link_class }}"{% endif %}>
    {% if lien.image %}
        <img src="{{ lien.image.url }}" alt="{{ lien.titre|escape }}"{% if img_class %} class="{{ img_class }}"{% endif %}>
    {% else %}
        <i class="{% pb_lien_app_icon lien.titre %}"></i>
        <span>{{ lien.titre }}</span>
    {% endif %}
</a>
{% endif %}
