{% load static %} 


<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>{% block title %}P&B_ENTREPRISE | Log in{% endblock title %} </title>
    <!-- Tell the browser to be responsive to screen width -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Font Awesome -->
    
    <link rel="stylesheet" href="{% static 'pb/plugins/fontawesome-free/css/all.min.css' %}">

    <!-- Ionicons -->
    <link rel="stylesheet" href="https://code.ionicframework.com/ionicons/2.0.1/css/ionicons.min.css">
    <!-- icheck bootstrap -->
    <link rel="stylesheet" href="{% static 'pb/plugins/icheck-bootstrap/icheck-bootstrap.min.css' %}">
    
    <link rel="stylesheet" href="{% static 'pb/dists/css/adminlte.min.css' %}">
    <!-- Google Font: Source Sans Pro -->
    <link href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700" rel="stylesheet">
</head>

<body class="hold-transition login-page">
    <div class="login-box">
        <div class="login-logo">
            <a href="../../index2.html"><b>LOGO</b></a>
        </div>
        <div class="card">
            <div class="card-body login-card-body" style="border-radius: 20px;">
                <p class="login-box-msg text-danger">CONNECTEZ-VOUS</p>
                <form action="../../base.html" method="post">
                    <div class="input-group mb-3">
                        <input type="email" class="form-control" placeholder="Email@gmail...">
                        <div class="input-group-append">
                            <div class="input-group-text">
                                <span class="fas fa-at"></span>
                            </div>
                        </div>
                    </div>
                    <a href="../examples/forgot-password.html" class="text-left" style="display: flex; margin-left: 150px; ">Mot de passe oublié</a>
                    <div class="input-group mb-3">
                        <input type="password" class="form-control" placeholder="Mot de passe...">
                        <div class="input-group-append">
                            <div class="input-group-text">
                                <span class="fas fa-key"></span>
                            </div>
                        </div>
                    </div>

                    <div class="mb-3 text-center">
                        <button type="submit" class="btn btn-default text-center" style="border-radius: 20px;background: rgba(255, 255, 255, 0.2);
                        border-radius: 16px;
                        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.397);
                        backdrop-filter: blur(5px);
                        -webkit-backdrop-filter: blur(5px);
                        border: 1px solid rgba(255, 255, 255, 0.3);">CONNEXION</button>
                    </div>
                </form>
            </div>
            <!-- /.login-card-body -->
        </div>
    </div>
    <!-- /.login-box -->

    <!-- jQuery -->
    <script src="{% static 'pb/plugins/jquery/jquery.min.js' %}"></script>
    <!-- Bootstrap 4 -->
    <script src="{% static 'pb/plugins/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
    <!-- AdminLTE App -->
    <script src="{% static 'pb/dists/js/adminlte.min.js' %}"></script>
    
    <script>
        document.addEventListener("DOMContentLoaded ", function() {
            var myModal = new bootstrap.Modal(document.getElementById('modal-default'));
            myModal.show();

            setTimeout(function() {
                myModal.hide();
            }, 3000);
        });
    </script>

</body>

</html>
