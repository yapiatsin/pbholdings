<div class="col-md-{{ col|default:'4' }}">
    <div class="card pb-panel">
        <div class="card-header pb-panel__header">
            <div class="pb-panel__heading">
                <strong class="pb-panel__title">{{ title }}</strong>
                {% if hint %}<span class="pb-panel__hint">{{ hint }}</span>{% endif %}
            </div>
            {% if badge %}
            <div class="pb-panel__tools">
                <span class="badge badge-danger">{{ badge }}</span>
            </div>
            {% endif %}
        </div>
        <div class="card-body pb-panel__body">
            <div class="chart pb-panel__chart{% if chart_class %} {{ chart_class }}{% endif %}"{% if height %} style="height: {{ height }}px; min-height: {{ height }}px;"{% endif %}>
                <canvas id="{{ chart_id }}"></canvas>
            </div>
        </div>
    </div>
</div>
