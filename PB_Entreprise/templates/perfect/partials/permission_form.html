<form method="post" id="permissionUpdateForm-{{ object.pk }}" class="pb-modal-default__form" action="{% url 'update_permission' object.id %}" enctype="multipart/form-data">
    {% csrf_token %}
    <div class="modal-header">
        <h4 class="modal-title">Modifier la permission {{ object.name }}</h4>
        <button type="button" class="close" data-dismiss="modal" aria-label="Fermer">
            <span aria-hidden="true">&times;</span>
        </button>
    </div>
    <div class="modal-body">
        <div class="row pb-modal-grid pb-modal-saisie-layout">
            <div class="col-12">
                <div class="pb-modal-panel">
                    <div class="pb-modal-panel__title">Informations de la permission</div>
                    <div class="row">
                        <div class="col-12">
                            <div class="pb-modal-field">
                                <label class="pb-modal-field__label" for="{{ form.name.id_for_label }}">Nom de la permission</label>
                                {{ form.name }}
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="pb-modal-field">
                                <label class="pb-modal-field__label" for="{{ form.categorie.id_for_label }}">Catégorie</label>
                                {{ form.categorie }}
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="pb-modal-field pb-modal-field--last">
                                <label class="pb-modal-field__label" for="{{ form.url.id_for_label }}">URL</label>
                                {{ form.url }}
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="modal-footer">
        <div class="pb-modal-default__footer-left">
            <button type="button" class="btn pb-modal-default__btn-cancel" data-dismiss="modal">Annuler</button>
        </div>
        <div class="pb-modal-default__footer-actions">
            <button type="submit" class="btn pb-modal-default__btn-submit">Enregistrer</button>
        </div>
    </div>
</form>
