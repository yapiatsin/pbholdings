<div class="pb-modal-field">
    <label class="pb-modal-field__label" for="period-select">Période</label>
    <select id="period-select" name="periode" class="form-control">
        <option value="today" {% if selected_period == 'today' %}selected{% endif %}>Aujourd'hui</option>
        <option value="week" {% if selected_period == 'week' %}selected{% endif %}>Cette semaine</option>
        <option value="month" {% if selected_period == 'month' %}selected{% endif %}>Ce mois</option>
        <option value="year" {% if selected_period == 'year' %}selected{% endif %}>Cette année</option>
        <option value="custom" {% if selected_period == 'custom' %}selected{% endif %}>Personnalisé</option>
    </select>
</div>
<div id="custom-period-fields">
    <div class="pb-modal-field">
        <label class="pb-modal-field__label" for="{{ form.date_debut.id_for_label }}">Date début</label>
        {{ form.date_debut }}
    </div>
    <div class="pb-modal-field">
        <label class="pb-modal-field__label" for="{{ form.date_fin.id_for_label }}">Date fin</label>
        {{ form.date_fin }}
    </div>
    <div class="pb-modal-field">
        <label class="pb-modal-field__label" for="{{ form.categorie.id_for_label }}">Catégorie</label>
        {{ form.categorie }}
    </div>
    <div class="pb-modal-field">
        <label class="pb-modal-field__label" for="{{ form.immatriculation.id_for_label }}">Matricule</label>
        {{ form.immatriculation }}
    </div>
</div>
