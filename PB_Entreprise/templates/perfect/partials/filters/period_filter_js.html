<script>
(function () {
    function initPeriodFilterToggle(form) {
        if (form.dataset.pbPeriodFilterBound === '1') return;

        const periodSelect = form.querySelector('#period-select');
        const customFields = form.querySelector('#custom-period-fields');
        if (!periodSelect || !customFields) return;

        form.dataset.pbPeriodFilterBound = '1';

        function toggleCustomFields() {
            const show = periodSelect.value === 'custom';
            customFields.hidden = !show;
            customFields.style.display = show ? 'block' : 'none';
            customFields.classList.toggle('is-visible', show);
        }

        periodSelect.addEventListener('change', toggleCustomFields);
        toggleCustomFields();
    }

    function initAllPeriodFilters() {
        document.querySelectorAll('.pb-modal-default__form').forEach(initPeriodFilterToggle);
    }

    window.pbInitPeriodFilters = initAllPeriodFilters;

    if (!window.pbPeriodFilterListenerBound) {
        window.pbPeriodFilterListenerBound = true;
        document.addEventListener('pb:livefilter', initAllPeriodFilters);
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initAllPeriodFilters);
        } else {
            initAllPeriodFilters();
        }
    } else {
        initAllPeriodFilters();
    }
})();
</script>
