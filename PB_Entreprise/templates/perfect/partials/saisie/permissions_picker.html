<div class="pb-modal-permissions-picker" data-permission-picker>
    <div class="pb-modal-permissions-search mb-3">
        <div class="input-group">
            <div class="input-group-prepend">
                <span class="input-group-text"><i class="fa fa-search"></i></span>
            </div>
            <input type="text"
                   id="{{ permission_search_id }}"
                   class="form-control js-permission-search"
                   placeholder="Filtrer les permissions…"
                   autocomplete="off"
                   spellcheck="false">
            <div class="input-group-append">
                <button type="button"
                        class="btn btn-outline-secondary js-permission-clear"
                        id="{{ permission_clear_id }}"
                        hidden
                        aria-label="Effacer la recherche">
                    <i class="fa fa-times"></i>
                </button>
            </div>
        </div>
    </div>
    <div class="card pb-modal-permissions-scroll-card mb-0">
        <div class="card-body pb-modal-permissions-card pb-modal-permissions-card--scroll" id="{{ permission_container_id }}">
            {% for group in permission_groups %}
                <section class="pb-modal-permissions__group"
                         data-permission-group
                         data-permission-category="{{ group.category.categorie|lower }}">
                    <header class="pb-modal-permissions__group-title">
                        <span class="pb-modal-permissions__group-label">{{ group.category.categorie }}</span>
                        <span class="pb-modal-permissions__group-count">{{ group.permissions|length }}</span>
                    </header>
                    <div class="row pb-modal-permissions">
                        {% for perm in group.permissions %}
                            <div class="col-md-4 pb-modal-permissions__item js-permission-item {{ permission_item_class }}"
                                 data-permission-text="{{ group.category.categorie|lower }} {{ perm.name|lower }}">
                                <label class="pb-modal-permissions__toggle" for="id_{{ checkbox_id_prefix }}_{{ perm.pk }}">
                                    <input type="checkbox"
                                           name="permissions"
                                           value="{{ perm.pk }}"
                                           id="id_{{ checkbox_id_prefix }}_{{ perm.pk }}"
                                           class="pb-modal-permissions__checkbox"
                                           {% if perm.pk in selected_permission_ids %}checked{% endif %}>
                                    <span class="pb-modal-permissions__text">{{ perm.name }}</span>
                                </label>
                            </div>
                        {% endfor %}
                    </div>
                </section>
            {% empty %}
                <p class="pb-modal-permissions__empty text-muted mb-0">Aucune permission disponible.</p>
            {% endfor %}
        </div>
    </div>
    <div id="{{ permission_no_results_id }}" class="alert alert-info mt-2 mb-0 js-permission-empty" hidden>
        <i class="fa fa-info-circle"></i> Aucune permission trouvée pour votre recherche.
    </div>
</div>
