{% load static %}
<div class="pb-sidebar-profile">
    <a href="{% url 'change_password' %}" class="pb-sidebar-profile-link" title="Mon profil">
        {% include 'perfect/partials/user_avatar.html' with profile=navbar_profile user=user avatar_class='pb-sidebar-avatar' %}
        <span class="pb-sidebar-user-meta">
            <span class="pb-sidebar-user-name">{{ user.prenom|default:user.username }} {{ user.nom }}</span>
            <span class="pb-sidebar-user-role">{{ navbar_role_label }}</span>
        </span>
        <i class="fas fa-chevron-down pb-sidebar-profile__chevron" aria-hidden="true"></i>
    </a>
</div>
